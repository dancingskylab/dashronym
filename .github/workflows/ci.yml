name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pubspec minimum is also the latest stable release, so one strict lane
  # covers both until Flutter ships a newer stable.
  LATEST_FLUTTER_VERSION: "3.50.0"

jobs:
  validate:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - "3.50.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        if: matrix.flutter-version == env.LATEST_FLUTTER_VERSION
        run: dart format --output=none --set-exit-if-changed .

      - name: Run strict static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        # Pixel goldens are verified on their canonical macOS renderer below.
        run: flutter test --exclude-tags golden

      - name: Build API documentation without warnings
        if: matrix.flutter-version == env.LATEST_FLUTTER_VERSION
        shell: bash
        run: |
          set -o pipefail
          dart doc --output .dart_tool/api-docs 2>&1 | tee /tmp/dartdoc.log
          if grep -Eiq '(^|[[:space:]])(warning|error):' /tmp/dartdoc.log; then
            echo "dartdoc emitted a warning or error."
            exit 1
          fi

      - name: Validate package publication
        if: matrix.flutter-version == env.LATEST_FLUTTER_VERSION
        run: dart pub publish --dry-run

  canary:
    # Early warning about the next Flutter release. Never blocks merges.
    name: Flutter beta (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter beta
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --exclude-tags golden

  web:
    # Web keyboard and semantics behave differently (for example, Enter maps
    # to ButtonActivateIntent). Never blocks merges.
    name: Web tests on Chrome (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest supported Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.LATEST_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests on Chrome
        run: flutter test --platform chrome --exclude-tags golden

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest supported Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.LATEST_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Collect line and branch coverage
        run: >-
          flutter test --exclude-tags golden --coverage --branch-coverage

      - name: Enforce coverage floors
        run: >-
          python3 .github/scripts/check_lcov.py coverage/lcov.info
          --min-lines 95
          --min-branches 85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  goldens:
    name: Golden tests
    # Pinned so a runner image change cannot shift rendering under the goldens.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest supported Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.LATEST_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify macOS golden images
        run: flutter test --tags golden

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 14
